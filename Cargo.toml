[workspace]
members = [
    "crates/api",
    "crates/store",
    "crates/seeder",
    "crates/worker",
    "crates/engine"
]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
axum = "0.8.9"
sqlx = { version = "0.8.6", default-features =  false, features = ["runtime-tokio", "postgres", "macros", "chrono", "rust_decimal", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rust_decimal = { version = "1.36", features = ["serde-float"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
argon2 = "0.5.3"
jsonwebtoken = "9.3.0"
bip39 = { version = "2.1.0", features = ["rand"] }
solana-sdk = "2.3"
solana-client = "2.3"
redis = { version = "0.27", features = ["tokio-comp", "streams"] }
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = "0.3"